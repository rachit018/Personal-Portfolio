<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow Ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#accentGlow)" stroke-width="2.5" opacity="0.8" filter="url(#glow)"/>
  
  <!-- Main Background Disc -->
  <circle cx="100" cy="100" r="88" fill="#0f172a" stroke="#1e293b" stroke-width="3" />
  
  <!-- Background Pattern / Digital Circuit Elements -->
  <path d="M 40 100 Q 70 80 100 100 T 160 100" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="70" cy="90" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="130" cy="90" r="3" fill="#818cf8" opacity="0.6"/>
  
  <!-- Stylized Developer Silhouette / Monogram -->
  <g transform="translate(0, 5)">
    <!-- Shoulders -->
    <path d="M 45 160 C 45 130, 70 120, 100 120 C 130 120, 155 130, 155 160 Z" fill="url(#bgGrad)" opacity="0.95" />
    
    <!-- Neck -->
    <rect x="90" y="105" width="20" height="20" rx="4" fill="#cbd5e1" opacity="0.9" />
    
    <!-- Head -->
    <circle cx="100" cy="80" r="32" fill="#e2e8f0" />
    
    <!-- Modern Tech Hair / Hairline -->
    <path d="M 70 75 C 70 50, 90 44, 100 44 C 115 44, 130 50, 130 75 C 122 62, 110 58, 100 60 C 88 62, 78 68, 70 75 Z" fill="#0f172a" />
    
    <!-- Smart Glasses Frame -->
    <rect x="76" y="73" width="20" height="13" rx="3" fill="#090d16" stroke="#38bdf8" stroke-width="1.8" />
    <rect x="104" y="73" width="20" height="13" rx="3" fill="#090d16" stroke="#38bdf8" stroke-width="1.8" />
    <line x1="96" y1="79" x2="104" y2="79" stroke="#38bdf8" stroke-width="1.8" />
    
    <!-- Glasses Reflection -->
    <line x1="79" y1="76" x2="84" y2="83" stroke="#ffffff" stroke-width="1" opacity="0.7" />
    <line x1="107" y1="76" x2="112" y2="83" stroke="#ffffff" stroke-width="1" opacity="0.7" />
    
    <!-- Friendly Smile -->
    <path d="M 94 95 Q 100 99 106 95" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" />
  </g>
  
  <!-- Tech Floating Node Badges -->
  <circle cx="150" cy="48" r="8" fill="#10b981" />
  <polyline points="146,48 149,51 154,45" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
